<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA14 Cleanup (tạm — xóa sau QA)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui;padding:24px;max-width:800px}button{font-size:18px;padding:12px 24px;margin:12px 0}#log{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:8px;margin-top:16px}</style>
</head>
<body>
<h1>🧹 QA14 Cleanup</h1>
<p>Xóa toàn bộ fixture QA14 (transactions, transfer, lots, prices, investments, goals) + hoàn nguyên số dư đúng logic app. Không dùng confirm().</p>
<button id="runBtn">Chạy cleanup QA14</button>
<div id="log">Chưa chạy.</div>
<script>
const SUPABASE_URL="https://mxjcpnmquxjkrfrchivg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14amNwbm1xdXhqa3JmcmNoaXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDQ0NDEsImV4cCI6MjEwNTEyMDQ0MX0.xk_BAHOUkK4JJFXDBJA1NsXKzAgyDQgy46qeVKW-ZlM";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const logEl=document.getElementById("log");
function log(m){ logEl.textContent+=(logEl.textContent==="Chưa chạy."?"":"\n")+m; }
const BASELINE={}; // name -> balance, filled at start

document.getElementById("runBtn").addEventListener("click",async()=>{
  document.getElementById("runBtn").disabled=true;
  logEl.textContent="";
  try{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){ log("❌ Chưa đăng nhập."); return; }
    const uid=session.user.id;
    log("👤 user: "+uid.slice(0,8)+"…");

    // 0. Ghi nhận balances hiện tại (để đối chiếu sau)
    const {data:accts}=await supabaseClient.from("accounts").select("id,name,balance").eq("user_id",uid);
    const balBefore={}; (accts||[]).forEach(a=>balBefore[a.name]=Number(a.balance));

    // 1. LOTS QA14 (qua investment name) — xóa bằng RPC atomic, mới nhất trước
    const {data:invs}=await supabaseClient.from("investments").select("id,name").eq("user_id",uid).ilike("name","QA14%");
    const invIds=(invs||[]).map(i=>i.id);
    let lotsDeleted=0, lotErrors=[];
    if(invIds.length){
      const {data:lots}=await supabaseClient.from("investment_lots").select("id,side,transacted_at,investment_id").in("investment_id",invIds).order("transacted_at",{ascending:false});
      for(const l of (lots||[])){
        const {error}=await supabaseClient.rpc("delete_investment_trade",{p_lot_id:l.id});
        if(error) lotErrors.push(l.id+": "+error.message); else lotsDeleted++;
      }
      log("✅ lots đã xóa qua RPC: "+lotsDeleted+(lotErrors.length?" | LỖI: "+lotErrors.join("; "):""));
    } else log("ℹ️ không có investment QA14.");

    // 2. PRICES QA14
    let pricesDeleted=0;
    if(invIds.length){
      const {data:pr}=await supabaseClient.from("investment_prices").select("id").in("investment_id",invIds);
      for(const p of (pr||[])){
        const {error}=await supabaseClient.from("investment_prices").delete().eq("id",p.id);
        if(!error) pricesDeleted++; else log("⚠️ price "+p.id+": "+error.message);
      }
      log("✅ prices đã xóa: "+pricesDeleted);
    }

    // 3. INVESTMENTS QA14
    let invsDeleted=0;
    for(const i of (invs||[])){
      const {error}=await supabaseClient.from("investments").delete().eq("id",i.id).eq("user_id",uid);
      if(!error) invsDeleted++; else log("⚠️ investment "+i.name+": "+error.message);
    }
    log("✅ investments đã xóa: "+invsDeleted);

    // 4. TRANSACTIONS QA14 còn lại (lots đã xóa kéo theo invest tx qua RPC)
    const {data:txs}=await supabaseClient.from("transactions").select("*").eq("user_id",uid).ilike("description","%QA14%");
    let txDeleted=0, txErrors=[];
    for(const t of (txs||[])){
      if(t.type==="transfer"){
        const {error}=await supabaseClient.rpc("delete_transfer",{p_tx_id:t.id});
        if(error) txErrors.push(t.id+": "+error.message); else txDeleted++;
      }else if(t.account_id){
        const {data:acc}=await supabaseClient.from("accounts").select("balance").eq("id",t.account_id).eq("user_id",uid).single();
        if(!acc){ txErrors.push(t.id+": no account"); continue; }
        const cur=Number(acc.balance||0);
        const nb=t.type==="income"?cur-Number(t.amount):cur+Number(t.amount);
        const {error:uErr}=await supabaseClient.from("accounts").update({balance:nb}).eq("id",t.account_id).eq("user_id",uid);
        if(uErr){ txErrors.push(t.id+": bal "+uErr.message); continue; }
        const {error:dErr}=await supabaseClient.from("transactions").delete().eq("id",t.id).eq("user_id",uid);
        if(dErr){ await supabaseClient.from("accounts").update({balance:cur}).eq("id",t.account_id).eq("user_id",uid); txErrors.push(t.id+": del "+dErr.message+" (đã khôi phục số dư)"); }
        else txDeleted++;
      }else{
        const {error}=await supabaseClient.from("transactions").delete().eq("id",t.id).eq("user_id",uid);
        if(error) txErrors.push(t.id+": "+error.message); else txDeleted++;
      }
    }
    log("✅ transactions đã xóa: "+txDeleted+(txErrors.length?" | LỖI: "+txErrors.join("; "):""));

    // 5. GOALS QA14 (contributions cascade theo app)
    const {data:goals}=await supabaseClient.from("goals").select("id,name").eq("user_id",uid).ilike("name","QA14%");
    let goalsDeleted=0;
    for(const g of (goals||[])){
      const {error}=await supabaseClient.from("goals").delete().eq("id",g.id).eq("user_id",uid);
      if(!error) goalsDeleted++; else log("⚠️ goal "+g.name+": "+error.message);
    }
    log("✅ goals đã xóa: "+goalsDeleted);

    // 6. VERIFY residue = 0
    const checks=[];
    const q1=await supabaseClient.from("transactions").select("id",{count:"exact",head:true}).eq("user_id",uid).ilike("description","%QA14%");
    checks.push(["transactions QA14 còn lại",q1.count]);
    const q2=await supabaseClient.from("investments").select("id",{count:"exact",head:true}).eq("user_id",uid).ilike("name","QA14%");
    checks.push(["investments QA14 còn lại",q2.count]);
    const q3=await supabaseClient.from("goals").select("id",{count:"exact",head:true}).eq("user_id",uid).ilike("name","QA14%");
    checks.push(["goals QA14 còn lại",q3.count]);
    const q4=await supabaseClient.from("goal_contributions").select("id,goals!inner(name)",{count:"exact",head:true}).eq("user_id",uid).ilike("goals.name","QA14%");
    checks.push(["contributions QA14 còn lại",q4.count]);
    let residueFail=false;
    checks.forEach(([n,c])=>{ log((c===0?"✅":"❌")+" "+n+": "+c); if(c!==0) residueFail=true; });

    // 7. Đối chiếu balances
    const {data:acctsAfter}=await supabaseClient.from("accounts").select("name,balance").eq("user_id",uid);
    const EXPECTED={"Vietcombank":6000000,"the ATM":1000000,"ăn cơm":0,"HSBC":-1000000,"TPBANK":1000000};
    let balOk=true;
    (acctsAfter||[]).forEach(a=>{
      const exp=EXPECTED[a.name];
      const got=Number(a.balance);
      if(exp!==undefined&&got!==exp){ log("❌ balance "+a.name+": "+got+" (kỳ vọng "+exp+")"); balOk=false; }
    });
    if(balOk) log("✅ balances khớp baseline 100%");

    log(residueFail||!balOk?"\n🔴 CLEANUP CHƯA SẠCH — cần kiểm tra.":"\n🟢 CLEANUP HOÀN TẤT — residue = 0, balances khớp baseline.");
  }catch(e){ log("❌ EXCEPTION: "+(e&&e.message||e)); }
});
</script>
</body>
</html>
