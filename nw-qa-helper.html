<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Helper — Assets & Liabilities (TẠM THỜI)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;background:#f6fbf6}
.warn{background:#fff3cd;border:2px solid #c90;padding:12px;border-radius:8px;font-weight:bold}
button{font-size:15px;padding:10px 16px;margin:6px 6px 6px 0;border:none;border-radius:8px;background:#2864e8;color:#fff;cursor:pointer}
button.danger{background:#dc3545}
#log{background:#111;color:#0f0;padding:12px;border-radius:8px;white-space:pre-wrap;font-family:monospace;font-size:13px;max-height:400px;overflow:auto;margin-top:12px}
</style>
</head>
<body>
<h1>🛠️ QA Helper — Assets & Liabilities (trang tạm)</h1>
<div class="warn">Dùng để setup/dọn dữ liệu test cho QA UI. Không đụng DB schema. File này sẽ bị xóa sau khi xong.</div>
<div id="status">Đang tải...</div>
<div id="btns" style="display:none;">
<button onclick="qaState()">📊 Xem trạng thái hiện tại</button>
<button onclick="qaCreateCreditPos()">➕ Tạo "QA Credit Dương" (credit, +300.000đ)</button>
<button onclick="qaSetVCB(6500000)">💱 VCB → 6.500.000đ</button>
<button onclick="qaSetVCB(6000000)">💱 VCB → 6.000.000đ (khôi phục)</button>
<button onclick="qaTransfer()">🔁 Transfer QA 100.000đ VCB→ATM</button>
<button onclick="qaDeleteTransfer()">🗑️ Xóa transfer QA vừa tạo</button>
<button onclick="qaCreateBank('QA Link Test')">➕ Tạo account "QA Link Test" (bank, 0đ)</button>
<button onclick="qaDeleteNwItem('QA BĐS')">🗑️ Xóa item "QA BĐS"</button>
<button onclick="qaDeleteNwItem('QA Vay NH')">🗑️ Xóa item "QA Vay NH"</button>
<button onclick="qaDeleteNwItem('QA ATM')">🗑️ Xóa item "QA ATM"</button>
<button onclick="qaDeleteNwItem('QA VCB')">🗑️ Xóa item "QA VCB"</button>
<button onclick="qaDeleteNwItem('QA HSBC')">🗑️ Xóa item "QA HSBC"</button>
<button onclick="qaDeleteNwItem('QA Credit+')">🗑️ Xóa item "QA Credit+"</button>
<button class="danger" onclick="qaDeleteAccount('QA Credit Dương')">🗑️ Xóa account "QA Credit Dương"</button>
<button onclick="qaDeleteTxByDesc('QA income NW10')">🗑️ Xóa giao dịch "QA income NW10"</button>
<button class="danger" onclick="qaCleanup()">🧹 Cleanup toàn bộ QA</button>
</div>
<div id="log"></div>
<script>
const SUPABASE_URL="https://mxjcpnmquxjkrfrchivg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14amNwbm1xdXhqa3JmcmNoaXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDQ0NDEsImV4cCI6MjEwNTEyMDQ0MX0.xk_BAHOUkK4JJFXDBJA1NsXKzAgyDQgy46qeVKW-ZlM";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function log(m){document.getElementById("log").textContent+=m+"\n";}
let uid=null, lastTransferId=null;
async function init(){
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){document.getElementById("status").textContent="Chưa đăng nhập.";return;}
    uid=session.user.id;
    document.getElementById("status").textContent="Sẵn sàng.";
    document.getElementById("btns").style.display="block";
}
async function qaState(){
    const {data:accs}=await supabaseClient.from("accounts").select("id,name,type,balance").eq("user_id",uid).order("name");
    const {data:items}=await supabaseClient.from("net_worth_items").select("id,name,type,category,account_id,value").eq("user_id",uid).order("name");
    const {data:txs}=await supabaseClient.from("transactions").select("id,description,amount").eq("user_id",uid).ilike("description","%QA%");
    log("=== ACCOUNTS ==="); (accs||[]).forEach(a=>log(a.name+" ["+a.type+"] = "+a.balance));
    log("=== NW ITEMS ("+(items||[]).length+") ==="); (items||[]).forEach(i=>log(i.name+" ["+i.type+"/"+i.category+"] account="+(i.account_id||"-")+" value="+(i.value??"-")));
    log("=== QA TRANSACTIONS ("+(txs||[]).length+") ==="); (txs||[]).forEach(t=>log(t.id+" "+t.description+" "+t.amount));
}
async function qaCreateCreditPos(){
    const {data,error}=await supabaseClient.from("accounts").insert({user_id:uid,name:"QA Credit Dương",type:"credit",balance:300000}).select().single();
    log(error?("LỖI: "+error.message):("Đã tạo QA Credit Dương id="+data.id));
}
async function qaSetVCB(bal){
    const {error}=await supabaseClient.from("accounts").update({balance:bal}).eq("user_id",uid).eq("name","Vietcombank");
    log(error?("LỖI: "+error.message):("VCB balance -> "+bal));
}
async function accIdByName(name){
    const {data}=await supabaseClient.from("accounts").select("id").eq("user_id",uid).eq("name",name).single();
    return data&&data.id;
}
async function qaTransfer(){
    const fromId=await accIdByName("Vietcombank"), toId=await accIdByName("the ATM");
    const {data,error}=await supabaseClient.rpc("create_transfer",{p_from_account_id:fromId,p_to_account_id:toId,p_amount:100000,p_transaction_date:new Date().toISOString().split("T")[0],p_description:"QA transfer NW9"});
    if(error){log("LỖI transfer: "+error.message);return;}
    const {data:tx}=await supabaseClient.from("transactions").select("id").eq("user_id",uid).eq("description","QA transfer NW9").order("created_at",{ascending:false}).limit(1).single();
    lastTransferId=tx&&tx.id;
    log("Đã tạo transfer QA id="+lastTransferId);
}
async function qaDeleteTransfer(){
    const {data:tx}=await supabaseClient.from("transactions").select("id").eq("user_id",uid).eq("description","QA transfer NW9").order("created_at",{ascending:false}).limit(1).maybeSingle();
    if(!tx){log("Không tìm thấy transfer QA.");return;}
    const {error}=await supabaseClient.rpc("delete_transfer",{p_tx_id:tx.id});
    log(error?("LỖI: "+error.message):("Đã xóa transfer QA "+tx.id+" (tìm theo mô tả, không phụ thuộc biến tạm)"));
    lastTransferId=null;
}
async function qaCreateBank(name){
    const {data,error}=await supabaseClient.from("accounts").insert({user_id:uid,name:name,type:"bank",balance:0}).select().single();
    log(error?("LỖI: "+error.message):("Đã tạo account "+name+" id="+data.id));
}
async function qaDeleteNwItem(name){
    const {error}=await supabaseClient.from("net_worth_items").delete().eq("user_id",uid).eq("name",name);
    log(error?("LỖI xóa "+name+": "+error.message):("Đã xóa item "+name));
}
async function qaDeleteTxByDesc(desc){
    const {error}=await supabaseClient.from("transactions").delete().eq("user_id",uid).eq("description",desc);
    log(error?("LỖI xóa tx "+desc+": "+error.message):("Đã xóa tx "+desc+" (xóa trực tiếp, balance sẽ được restore riêng)"));
}
async function qaDeleteAccount(name){
    const {error}=await supabaseClient.from("accounts").delete().eq("user_id",uid).eq("name",name);
    log(error?("LỖI xóa account "+name+": "+error.message):("Đã xóa account "+name));
}
async function qaCleanup(){
    log("--- cleanup ---");
    for(const n of ["QA BĐS","QA Vay NH","QA ATM","QA VCB","QA HSBC","QA Credit+"]) await qaDeleteNwItem(n);
    if(lastTransferId) await qaDeleteTransfer();
    await qaDeleteAccount("QA Credit Dương");
    await qaSetVCB(6000000);
    log("--- xong, kiểm tra lại ---");
    await qaState();
}
init();
</script>
</body>
</html>
